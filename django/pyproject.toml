[project]
name = "inttegro-django-demo"
version = "1.8.2"
description = "An async Inttegro hosted-checkout demo for Django"
requires-python = ">=3.13"
dependencies = [
  "django==5.2.17",
  "inttegro==6.3.0",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "uvicorn[standard]==0.52.4",
  "workers-py>=1.17.1",
  "workers-runtime-sdk",
]
