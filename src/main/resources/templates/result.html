<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172822">
  <title>Ledgerline invoice</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="story-ledger result-page ledger-result-page">
    <section class="result-card ledger-result-card">
      <header class="result-brand-row">
	<a class="brand" href="/" aria-label="Ledgerline home"><span class="brand-mark">L</span>Ledgerline</a>
	<span class="invoice-state">Invoice INV-2048</span>
      </header>
      <div class="ledger-result-content">
	<span class="result-mark" th:text="${complete} ? '✓' : '←'">✓</span>
	<p class="eyebrow" th:text="${complete} ? 'Payment submitted' : 'Payment paused'">Payment submitted</p>
	<h1 th:text="${complete} ? 'We’re reconciling your invoice.' : 'Your invoice is still open.'">We’re reconciling your invoice.</h1>
	<p th:text="${complete} ? 'Ledgerline will mark INV-2048 paid only after authoritative server verification completes.' : 'No completion was claimed and nothing was marked paid. You can return whenever you are ready.'"></p>
      </div>
      <dl class="result-invoice-summary">
	<div><dt>Invoice</dt><dd>INV-2048</dd></div>
	<div><dt>Client</dt><dd>Osei Studio</dd></div>
	<div><dt>Amount</dt><dd>GHS 50.00</dd></div>
	<div><dt>Status</dt><dd th:text="${complete} ? 'Verifying payment' : 'Payment due'">Verifying payment</dd></div>
      </dl>
      <div class="result-actions"><a class="primary-action" href="/">Return to invoice <span aria-hidden="true">→</span></a></div>
    </section>
  </main>
</body>
</html>
