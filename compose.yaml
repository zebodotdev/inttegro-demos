services:
  app:
    build:
      context: .
    env_file: .env
    init: true
    ports:
      - "3004:3004"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3004/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
