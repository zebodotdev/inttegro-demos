[project]
name = "inttegro-fastapi-demo"
version = "1.5.0"
description = "An async Inttegro hosted-checkout demo for FastAPI"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.141.1",
  "inttegro==6.3.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.22",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "uvicorn[standard]==0.52.4",
  "workers-py>=1.17.1",
  "workers-runtime-sdk",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
